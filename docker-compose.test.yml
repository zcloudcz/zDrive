version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: zdrive-test-postgres
    environment:
      POSTGRES_USER: zdrive
      POSTGRES_PASSWORD: zdrive_dev
      POSTGRES_DB: zdrive
    ports:
      - "5433:5432"
    volumes:
      - ./infra/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zdrive -d zdrive"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - zdrive-test-network

  redis:
    image: redis:7
    container_name: zdrive-test-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - zdrive-test-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: zdrive-test-azurite
    ports:
      - "10010:10000"
      - "10011:10001"
      - "10012:10002"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - zdrive-test-network

networks:
  zdrive-test-network:
    driver: bridge
