# Default values for zDrive Helm chart

namespace: zdrive

image:
  registry: ""  # ACR login server, e.g. zdrive.azurecr.io
  tag: latest
  pullPolicy: IfNotPresent

authService:
  replicaCount: 2
  image:
    repository: zdrive-auth
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

apiGateway:
  replicaCount: 2
  image:
    repository: zdrive-gateway
  port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  ingress:
    enabled: true
    className: nginx
    host: ""  # Set per environment
    tls: false

config:
  jwtIssuer: "zdrive"
  seqUrl: ""
  # Connection strings injected via secrets, not values
