apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zdrive.labels" . | nindent 4 }}
    {{- include "zdrive.selectorLabels" (dict "component" "auth-service" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.authService.replicaCount }}
  selector:
    matchLabels:
      {{- include "zdrive.selectorLabels" (dict "component" "auth-service" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zdrive.selectorLabels" (dict "component" "auth-service" "root" .) | nindent 8 }}
    spec:
      containers:
        - name: auth-service
          image: {{ include "zdrive.image" (dict "registry" .Values.image.registry "repository" .Values.authService.image.repository "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.authService.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: zdrive-config
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.authService.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.authService.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.authService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zdrive.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "zdrive.selectorLabels" (dict "component" "auth-service" "root" .) | nindent 4 }}
  ports:
    - port: 80
      targetPort: {{ .Values.authService.port }}
      protocol: TCP
