apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zdrive.labels" . | nindent 4 }}
    {{- include "zdrive.selectorLabels" (dict "component" "api-gateway" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "zdrive.selectorLabels" (dict "component" "api-gateway" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zdrive.selectorLabels" (dict "component" "api-gateway" "root" .) | nindent 8 }}
    spec:
      containers:
        - name: api-gateway
          image: {{ include "zdrive.image" (dict "registry" .Values.image.registry "repository" .Values.apiGateway.image.repository "tag" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.apiGateway.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: zdrive-config
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.apiGateway.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.apiGateway.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zdrive.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "zdrive.selectorLabels" (dict "component" "api-gateway" "root" .) | nindent 4 }}
  ports:
    - port: 80
      targetPort: {{ .Values.apiGateway.port }}
      protocol: TCP
{{- if .Values.apiGateway.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "zdrive.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: {{ .Values.apiGateway.ingress.className }}
  {{- if .Values.apiGateway.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.apiGateway.ingress.host }}
      secretName: zdrive-tls
  {{- end }}
  rules:
    - host: {{ .Values.apiGateway.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
{{- end }}
