name: Deploy web client

# Builds the Flutter web client and publishes it to GitHub Pages, replacing the
# previous flow where the bundle was built on a developer machine and pushed to
# a gh-pages branch by hand — nothing recorded which commit was live, and the
# classic Pages branch build gave no log when it failed.
on:
  # Lets a deploy be retried without an empty commit — GitHub Pages
  # infrastructure fails often enough to need it.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published client release tag (empty uses current master)'
        required: false
        type: string

permissions:
  contents: read

# A superseded deploy is worthless: only the newest commit should reach the
# site, and two concurrent Pages deployments conflict anyway.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Resolve published release from trusted history
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            version=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' src/client/zdrive_app/pubspec.yaml)
            RELEASE_TAG="v$version"
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a version tag'; exit 1; }
          sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/master
          [[ $(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft) == false ]]
          git checkout --detach "$sha"
          version=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' src/client/zdrive_app/pubspec.yaml)
          [[ "$RELEASE_TAG" == "v$version" ]]

      # Same pin as flutter-ci.yml, and for the same reason: the SDK bundles
      # its own package versions, so a floating `stable` resolves something
      # other than the committed lock. Bump both workflows together.
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.41.2"

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile
        working-directory: src/client/zdrive_app

      # API_BASE_URL is baked into the bundle at compile time
      # (ApiConstants.baseUrl is a const String.fromEnvironment), so the
      # deployed origin has to be decided here rather than at runtime. The
      # base-href is "/" because the site is served from a custom domain root,
      # not from /<repo>/.
      - name: Build web
        env:
          API_BASE_URL: ${{ vars.WEB_API_BASE_URL || 'https://zdrive-gateway.azurewebsites.net/api/v1' }}
        run: >-
          flutter build web --release
          --dart-define=API_BASE_URL="$API_BASE_URL"
          --base-href /
        working-directory: src/client/zdrive_app

      # The repository is private; publish only the distributable binaries
      # alongside the public web app so the small installer needs no token.
      # Retain historical payloads so already-downloaded installers keep working.
      # A release must be packaged before its web version can be deployed.
      - name: Include Windows release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $versionLine = Get-Content src/client/zdrive_app/pubspec.yaml | Where-Object { $_ -match '^version:' }
          $version = ($versionLine -replace '^version:\s*', '').Split('+')[0]
          ./scripts/Include-WindowsDownloads.ps1 -Repository $env:GH_REPO -Version $version -OutputDirectory src/client/zdrive_app/build/web/downloads

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/client/zdrive_app/build/web

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
