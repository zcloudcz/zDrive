# Static checks for the infrastructure definitions. Neither of these talks to
# Azure or needs credentials: `terraform validate` checks syntax, types and
# module wiring against the provider schemas, and `helm lint` renders the
# chart. A real `plan` or `apply` still needs a subscription and stays manual.

name: Infra CI

on:
  push:
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"

jobs:
  terraform:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Two independent roots: the AKS stack (kept, not deployed) and the
        # Container Apps stack the deploy pipeline actually targets.
        root:
          - infra/terraform
          - infra/terraform/container-apps

    defaults:
      run:
        working-directory: ${{ matrix.root }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # A lock file records provider versions, not the CLI version, so this
          # pin is separate from it: it keeps CI on one known CLI rather than
          # whatever `latest` becomes. The stacks declare `required_version >=
          # 1.5`, so a developer on any 1.5+ is fine.
          terraform_version: "1.15.8"

      - name: Format check
        run: terraform fmt -check -recursive

      # -backend=false skips remote state entirely; validate only needs the
      # provider schemas. -lockfile=readonly makes a provider version that
      # drifted from the committed .terraform.lock.hcl a failure rather than a
      # silent upgrade.
      - name: Init
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate

  helm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"

      # Each values file is linted separately: they override different keys, so
      # a template that only breaks under the production overrides would pass a
      # lint of the defaults alone.
      - name: Lint chart
        run: |
          for values in values.yaml values-staging.yaml values-production.yaml; do
            echo "::group::helm lint --values $values"
            helm lint infra/helm/zdrive --values "infra/helm/zdrive/$values"
            echo "::endgroup::"
          done
