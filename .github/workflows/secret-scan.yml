name: Secret scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Scans the working tree (not git history) so a secret committed and later
      # removed does not fail every future build. Any secret present in the
      # current tree fails CI.
      - name: Run gitleaks (working tree)
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:latest
          dir /repo
          --config /repo/.gitleaks.toml
          --no-banner
          --redact
          --exit-code 1
