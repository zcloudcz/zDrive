name: Upload iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published release tag'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/testflight.yml'
      - 'scripts/Build-IosRelease.sh'
      - 'scripts/Upload-TestFlight.sh'

permissions:
  contents: read

concurrency:
  group: testflight-upload
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check signing and upload scripts
        run: |
          bash -n scripts/Build-IosRelease.sh
          bash -n scripts/Upload-TestFlight.sh

  upload:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && vars.IOS_SIGNING_ENABLED == 'true' && vars.TESTFLIGHT_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    environment: client-release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      API_BASE_URL: https://zdrive-gateway.azurewebsites.net/api/v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select reviewed published source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" "$GITHUB_SHA"
          [[ $(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft) == false ]]
          # Keep reviewed CI helpers while selecting the immutable app sources.
          git restore --source="$sha" --staged --worktree -- src/client/zdrive_app
          version=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' src/client/zdrive_app/pubspec.yaml)
          [[ "$RELEASE_TAG" == "v$version" ]]
          echo "Source: $RELEASE_TAG ($sha)" >> "$GITHUB_STEP_SUMMARY"
          xcodebuild -version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - name: Build signed iOS package
        env:
          IOS_SIGNED: 'true'
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: bash scripts/Build-IosRelease.sh
      - name: Collect signed package
        run: |
          mkdir -p dist
          files=(src/client/zdrive_app/build/ios/ipa/*.ipa)
          [[ ${#files[@]} == 1 && -f "${files[0]}" ]]
          cp "${files[0]}" dist/zDrive-ios.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: testflight-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: bash scripts/Upload-TestFlight.sh
