name: Backend CI

on:
  push:
    paths:
      - "src/services/**"
      - "src/shared/**"
  pull_request:
    paths:
      - "src/services/**"
      - "src/shared/**"

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test --no-build --configuration Release --filter Category!=Integration --verbosity normal

  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zdrive
          POSTGRES_PASSWORD: zdrive_dev
          POSTGRES_DB: zdrive
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zdrive -d zdrive"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10010:10000
          - 10011:10001
          - 10012:10002

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Initialize test database schemas
        run: |
          PGPASSWORD=zdrive_dev psql -h localhost -p 5433 -U zdrive -d zdrive -f infra/docker/init-db.sql

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Integration tests
        run: dotnet test --no-build --configuration Release --filter Category=Integration --verbosity normal
        env:
          DATABASE_CONNECTION_STRING: "Host=localhost;Port=5433;Database=zdrive;Username=zdrive;Password=zdrive_dev"
          REDIS_CONNECTION_STRING: "localhost:6380"
          AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://localhost:10010/devstoreaccount1"
