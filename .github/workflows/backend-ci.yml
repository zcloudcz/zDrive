name: Backend CI

on:
  push:
    paths:
      - "src/services/**"
      - "src/shared/**"
  pull_request:
    paths:
      - "src/services/**"
      - "src/shared/**"

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test --no-build --configuration Release --filter Category!=Integration --verbosity normal

  # Every integration test starts its own Postgres (and Azurite, for
  # StorageService) through Testcontainers and points the service under test at
  # that container, so this job needs nothing but a Docker daemon — which the
  # ubuntu runner already provides. It used to declare postgres/redis/azurite
  # service containers, seed schemas with psql, and pass three connection-string
  # env vars; nothing read any of it.
  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Integration tests
        run: dotnet test --no-build --configuration Release --filter Category=Integration --verbosity normal
