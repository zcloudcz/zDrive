name: Flutter CI

on:
  push:
    paths:
      - "src/client/**"
      # Editing this workflow must run it, or a change to the pipeline ships
      # unexercised.
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "src/client/**"
      - ".github/workflows/flutter-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client/zdrive_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
