name: Flutter CI

on:
  push:
    paths:
      - "src/client/**"
      # Editing this workflow must run it, or a change to the pipeline ships
      # unexercised.
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "src/client/**"
      - ".github/workflows/flutter-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client/zdrive_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # --enforce-lockfile is the Flutter counterpart of terraform's
      # -lockfile=readonly: resolve exactly what pubspec.lock pins, and fail if
      # pubspec.yaml has drifted from it. Without it a PR that changes
      # pubspec.yaml and forgets the lock would re-resolve, pass green, and
      # leave the committed lock stale — which would make committing it
      # pointless.
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
