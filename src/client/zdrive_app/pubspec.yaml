name: zdrive_app
description: "zDrive — cloud storage platform"
publish_to: 'none'
version: 0.4.3+17

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  get_it: ^8.0.3
  injectable: ^2.5.0
  dio: ^5.8.0
  go_router: ^15.1.0
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  crypto: ^3.0.0
  intl: any
  file_picker: ^8.0.0
  share_plus: ^10.0.0
  timeago: ^3.6.0
  web: ^1.1.0
  flutter_web_auth_2: ^5.1.0
  qr_flutter: ^4.1.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.1
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Only for auth_interceptor_test.dart's in-memory FlutterSecureStorage
  # backend — TokenStorage has no seam of its own, so this is the smallest
  # way to give it a real, working store without a platform channel.
  flutter_secure_storage_platform_interface: ^1.1.2
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.4
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/zdrive-mark.png
    - assets/branding/zdrive-mark@2x.png
    - assets/branding/zdrive-mark@3x.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
